name: Deploy graphs

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful Prepare graphs run ID from main (artifact retained for 14 days)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt -r requirements.lock.txt
      - name: Validate and retrieve the prepared build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          mkdir -p output/prepared
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > output/run.json
          python src/pipeline/pages_snapshot.py validate-run --run output/run.json --repository "$GH_REPO" > output/run.env
          source output/run.env
          gh run download "$BUILD_RUN" --name "graphs-$attempt" --dir output/prepared
          python src/pipeline/pages.py unpack --archive output/prepared/graphs.tar.gz \
            --destination output/pages --revision "$revision"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages
          retention-days: 1

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
