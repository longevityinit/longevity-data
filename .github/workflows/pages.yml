name: Deploy graphs

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Optional rollback run ID; leave blank to deploy current main'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt -r requirements.lock.txt
      - name: Validate and retrieve the prepared build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_RUN: ${{ inputs.build_run }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p output/prepared
          automatic=false
          if [[ -z "$BUILD_RUN" ]]; then
            automatic=true
            current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            if [[ "$current" != "$EXPECTED_REVISION" ]]; then
              echo 'main changed while deployment was queued. Run Deploy graphs again.' >&2
              exit 1
            fi
            gh api --paginate --slurp "repos/$GH_REPO/actions/workflows/prepare-graphs.yml/runs?branch=main&head_sha=$EXPECTED_REVISION&per_page=100" > output/runs.json
            python src/pipeline/pages_snapshot.py select-run --runs output/runs.json \
              --repository "$GH_REPO" --revision "$EXPECTED_REVISION" > output/run.json
            BUILD_RUN=$(python -c 'import json; print(json.load(open("output/run.json"))["id"])')
          else
            [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
            gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > output/run.json
          fi
          python src/pipeline/pages_snapshot.py validate-run --run output/run.json --repository "$GH_REPO" > output/run.env
          source output/run.env
          gh run download "$BUILD_RUN" --name "graphs-$attempt" --dir output/prepared
          python src/pipeline/pages.py unpack --archive output/prepared/graphs.tar.gz \
            --destination output/pages --revision "$revision"
          if [[ "$automatic" == true ]]; then
            current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            [[ "$current" == "$revision" ]] || { echo 'main changed; run Deploy graphs again.' >&2; exit 1; }
          fi
          echo "Selected prepared run $BUILD_RUN, attempt $attempt, commit $revision. No rebuild or data refresh." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: output/pages
          retention-days: 1

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
