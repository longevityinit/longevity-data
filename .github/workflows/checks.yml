name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python, JavaScript, and Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements.lock.txt

      - name: Python tests
        run: python -m unittest discover -s tests -v

      - name: Install JavaScript dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Prepare pinned D3 for browser fixtures
        run: |
          mkdir -p output/charts/vendor
          curl --fail --show-error --silent --location --retry 3 --max-time 60 \
            https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js \
            --output output/charts/vendor/d3-7.9.0.min.js
          echo 'f2094bbf6141b359722c4fe454eb6c4b0f0e42cc10cc7af921fc158fceb86539  output/charts/vendor/d3-7.9.0.min.js' | sha256sum --check

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Chromium browser tests
        run: npm run test:browser
