name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements.lock.txt

      - name: Python tests
        run: python -m unittest discover -s tests -v

  javascript:
    name: JavaScript tests and style
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install JavaScript dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

  browser:
    name: Chromium fixture tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Keep this version aligned with @playwright/test in package.json and the lockfile.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The fixture server needs only Python's standard library, not pipeline dependencies.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check Playwright image and package versions match
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const expected = '1.64.1';
          const declared = JSON.parse(fs.readFileSync('package.json', 'utf8')).devDependencies['@playwright/test'];
          const installed = require('@playwright/test/package.json').version;
          if (declared !== expected || installed !== expected) {
            throw new Error(`Playwright image is ${expected}; package.json specifies ${declared}, installed ${installed}. Update the image tag, digest, and this check together.`);
          }
          JS

      - name: Prepare pinned D3 for browser fixtures
        run: |
          mkdir -p output/charts/vendor
          curl --fail --show-error --silent --location --retry 3 --max-time 60 \
            https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js \
            --output output/charts/vendor/d3-7.9.0.min.js
          echo 'f2094bbf6141b359722c4fe454eb6c4b0f0e42cc10cc7af921fc158fceb86539  output/charts/vendor/d3-7.9.0.min.js' | sha256sum --check

      - name: Chromium browser tests
        run: npm run test:browser
